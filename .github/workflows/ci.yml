name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # uiohook-napi (global input capture, screen-recorder cursor/click
      # tracking) has no prebuilt binary for Electron's ABI, so
      # `electron-builder install-app-deps` (npm's postinstall) falls back to
      # compiling its libuiohook dependency from source -- which needs these
      # X11 dev headers on Linux runners (not installed by default).
      - name: Install libuiohook build dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev libxt-dev

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Knip
        run: npm run knip

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Heavy: compiles native recording helpers per-OS and packages with
    # electron-builder -- allowed the extended 30min budget.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # libx11-dev/libxtst-dev/libxt-dev: uiohook-napi's libuiohook dependency
      # (no prebuilt binary for Electron's ABI, so it compiles from source).
      # libxext-dev/libxfixes-dev: native/linux-recorder's own XShm/XFixes
      # build dependencies (libx11-dev/libxrandr-dev already covers the rest
      # it needs). See recording-helper.ts.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev libxt-dev libxext-dev libxfixes-dev

      - run: npm ci

      # Native recording helper subprocesses (native/macos-recorder,
      # native/windows-recorder, native/linux-recorder) -- see
      # recording-helper.ts. Compile-only verification; none of the three
      # can be functionally exercised on a CI runner (no real display/
      # permission session), same caveat as the rest of this native-capture
      # work -- macOS has separately been verified with a real recording
      # during development, Windows/Linux have not.
      - name: Build native recording helper (macOS)
        if: runner.os == 'macOS'
        run: npm run build:native:macos

      - name: Build native recording helper (Windows)
        if: runner.os == 'Windows'
        run: npm run build:native:windows

      - name: Build native recording helper (Linux)
        if: runner.os == 'Linux'
        run: npm run build:native:linux

      - name: Build
        run: npm run build

      # Packaging + size reporting runs on every push and every PR push, so PR
      # size can be diffed against main (see the pr-size-comment job below) --
      # this is the extra packaging cost that tradeoff was weighed against.
      - name: Package for size measurement (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      # electron-builder.yml has mac.notarize: true, but only release.yml imports the
      # real Apple signing certificate. CSC_IDENTITY_AUTO_DISCOVERY=false makes
      # electron-builder skip signing (and it auto-skips notarizing an unsigned app),
      # so this stays fast here and needs no Apple secrets.
      - name: Package for size measurement (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # AppImage only -- electron-builder.yml's linux target list also has snap/deb/rpm,
      # but snap needs snapcraft (not on this runner) and only AppImage size is tracked.
      - name: Package for size measurement (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      # Always writes size-report.json locally (picked up by the "Upload size
      # report" step below on PRs). Only POSTs to benpocket-backend -- recording
      # size history -- on pushes to main; BENPOCKET_BACKEND_URL/CI_METRICS_SECRET
      # are left unset on PR runs so the script's own guard skips the POST.
      - name: Report build size
        run: node scripts/report-build-size.mjs
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BENPOCKET_BACKEND_URL: ${{ github.event_name == 'push' && vars.BENPOCKET_BACKEND_URL || '' }}
          CI_METRICS_SECRET: ${{ github.event_name == 'push' && secrets.CI_METRICS_SECRET || '' }}

      - name: Upload size report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: size-report-${{ matrix.os }}
          path: size-report.json
          retention-days: 1

  pr-size-comment:
    name: Post PR size comment
    needs: build
    # always() so this still posts (showing "build failed" for the affected
    # row) if one matrix leg fails -- fail-fast: false means the others may
    # still have succeeded and uploaded their report.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: size-report-*
          path: reports

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build comment body
        run: node scripts/post-pr-size-comment.mjs
        env:
          # base.sha is the commit this PR branched from (kept in sync on each
          # push to the PR) -- lets the comment diff against that instead of
          # whatever happens to be newest on main. See post-pr-size-comment.mjs.
          BASE_COMMIT_SHA: ${{ github.event.pull_request.base.sha }}

      # Edits this workflow's own last comment on the PR if one exists (there's
      # no other job in this repo that comments on PRs, so --edit-last can't
      # clobber an unrelated comment); otherwise posts a new one.
      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if ! gh pr comment "$PR_NUMBER" --edit-last --body-file body.md 2>/dev/null; then
            gh pr comment "$PR_NUMBER" --body-file body.md
          fi
