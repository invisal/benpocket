appId: com.benpocket.app
productName: benpocket
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # Linux capture addon -- a compiled .node binary can't be dlopen'd from
  # inside an asar archive, so it needs to stay unpacked regardless of
  # electron-builder's own implicit native-module detection. macOS/Windows
  # no longer need an entry here: their native capture is a standalone
  # helper *executable*, spawned rather than require()'d, packaged below
  # via extraResources instead.
  - node_modules/capture-*/**
  # sharp's native addon (@img/sharp-<platform>) gets auto-unpacked by
  # electron-builder's .node detection, but the libvips shared library it
  # dlopen's at runtime lives in a sibling package (@img/sharp-libvips-*)
  # that has no .node file, so it's invisible to that detection and stays
  # packed inside app.asar -- .so files can't be dlopen'd from an asar
  # either, so it fails at runtime. Unpack both packages explicitly.
  - node_modules/sharp/**
  - node_modules/@img/**
extraResources:
  # The macOS/Windows native recording helper binaries -- see
  # recording-helper.ts's helperCandidates(), which resolves a packaged
  # build's helper at `${process.resourcesPath}/native/bin/<platform>-<arch>/`.
  - from: native/bin
    to: native/bin
win:
  executableName: benpocket
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
    - NSAppleEventsUsageDescription: Application requests permission to control System Events, to
        read a booted iOS Simulator window's on-screen position and size while recording it.
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  category: Utility
  syncDesktopName: true
snap:
  publish: github
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronLanguages:
  - en-US
publish:
  provider: github
  owner: invisal
  repo: benpocket
  releaseType: prerelease
