name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # uiohook-napi (global input capture, screen-recorder cursor/click
      # tracking) has no prebuilt binary for Electron's ABI, so
      # `electron-builder install-app-deps` (npm's postinstall) falls back to
      # compiling its libuiohook dependency from source -- which needs these
      # X11 dev headers on Linux runners (not installed by default).
      - name: Install libuiohook build dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev libxt-dev

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Knip
        run: npm run knip

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # libx11-dev/libxtst-dev/libxt-dev: uiohook-napi's libuiohook dependency
      # (no prebuilt binary for Electron's ABI, so it compiles from source).
      # libxext-dev/libxfixes-dev: native/linux-recorder's own XShm/XFixes
      # build dependencies (libx11-dev/libxrandr-dev already covers the rest
      # it needs). See recording-helper.ts.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev libxt-dev libxext-dev libxfixes-dev

      - run: npm ci

      # Native recording helper subprocesses (native/macos-recorder,
      # native/windows-recorder, native/linux-recorder) -- see
      # recording-helper.ts. Compile-only verification; none of the three
      # can be functionally exercised on a CI runner (no real display/
      # permission session), same caveat as the rest of this native-capture
      # work -- macOS has separately been verified with a real recording
      # during development, Windows/Linux have not.
      - name: Build native recording helper (macOS)
        if: runner.os == 'macOS'
        run: npm run build:native:macos

      - name: Build native recording helper (Windows)
        if: runner.os == 'Windows'
        run: npm run build:native:windows

      - name: Build native recording helper (Linux)
        if: runner.os == 'Linux'
        run: npm run build:native:linux

      - name: Build
        run: npm run build

      # Packaging + size reporting below only runs on pushes to main (this workflow's
      # push trigger is already scoped to branches: [main]) -- PRs stay compile-only
      # to avoid the extra packaging cost on every PR push.
      - name: Package for size measurement (Windows)
        if: github.event_name == 'push' && runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      # electron-builder.yml has mac.notarize: true, but only release.yml imports the
      # real Apple signing certificate. CSC_IDENTITY_AUTO_DISCOVERY=false makes
      # electron-builder skip signing (and it auto-skips notarizing an unsigned app),
      # so this stays fast here and needs no Apple secrets.
      - name: Package for size measurement (macOS)
        if: github.event_name == 'push' && runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # AppImage only -- electron-builder.yml's linux target list also has snap/deb/rpm,
      # but snap needs snapcraft (not on this runner) and only AppImage size is tracked.
      - name: Package for size measurement (Linux)
        if: github.event_name == 'push' && runner.os == 'Linux'
        run: npx electron-builder --linux AppImage --publish never

      - name: Report build size
        if: github.event_name == 'push'
        run: node scripts/report-build-size.mjs
        env:
          COMMIT_SHA: ${{ github.sha }}
          BENPOCKET_BACKEND_URL: ${{ vars.BENPOCKET_BACKEND_URL }}
          CI_METRICS_SECRET: ${{ secrets.CI_METRICS_SECRET }}
